name: Scala checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting, tests, and coverage
        run: sbt scalafmtCheckAll scalafmtSbtCheck clean coverage test coverageReport
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/scala-2.13/scoverage-report/
          if-no-files-found: error
      - name: Check browser adapter
        run: sbt web/scalafmtCheckAll web/test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build standalone JAR
        run: sbt clean test assembly
      - name: Build container
        run: docker build -t tictactoe .
      - name: Play a scripted match
        run: |
          printf 'Liam\nGwanni\n1\n4\n2\n5\n3\n' | docker run --rm -i tictactoe --plain > match.txt
          grep -F 'Liam (X) wins!' match.txt
